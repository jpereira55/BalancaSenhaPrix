<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Senha Toledo</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: 0 auto; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #004494; }
        .result { margin-top: 20px; padding: 15px; background-color: #f0f0f0; border-radius: 5px; }
        .result p { margin: 5px 0; }
        .note { font-size: 0.85em; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>Calculadora de Senha Toledo</h2>
    
    <div class="input-group">
        <label for="dia">Dia:</label>
        <input type="number" id="dia" placeholder="Ex: 23" min="1" max="31">
    </div>

    <div class="input-group">
        <label for="mes">Mês:</label>
        <input type="number" id="mes" placeholder="Ex: 08" min="1" max="12">
    </div>

    <button onclick="calcularSenhas()">Calcular</button>

    <div class="result" id="resultado" style="display:none;">
        <p><strong>Método Padrão (Dia+20, Mês+11):</strong> <span id="senha1"></span></p>
        <p><strong>Método Soma 2011:</strong> <span id="senha2"></span></p>
        <p class="note">Use a senha para abrir o menu da sua balança. Se der senha inválida, verifique a data da balança.</p>
    </div>

    <script>
        function calcularSenhas() {
            const dia = parseInt(document.getElementById('dia').value);
            const mes = parseInt(document.getElementById('mes').value);

            if (!dia || !mes) {
                alert("Por favor, insira o dia e o mês corretos.");
                return;
            }

            // Método 1: Dia + 20 e Mês + 11 (Ex: 28/08 -> 48 19 -> 4819)
            // Nota: O contexto mostra exemplos como 28+20=48 e 08+11=19.
            // Para meses com 1 dígito, geralmente mantém-se o zero à esquerda no exemplo, 
            // mas a soma matemática é 8+11=19. O exemplo textual sugere concatenação ou soma direta.
            // Vamos fazer a soma direta conforme a lógica matemática apresentada:
            const parteDia1 = dia + 20;
            const parteMes1 = mes + 11;
            // O exemplo "4819" sugere que se escreve o resultado das somas lado a lado.
            const senhaPadrao = parteDia1.toString() + parteMes1.toString();

            // Método 2: Dia/Mês + 2011 (Ex: 30/04 -> 3004 + 2011 = 5015)
            // Aqui o dia e mês formam um número (ex: 3004 para 30/04)
            // Precisamos formatar o mês com zero à esquerda se for menor que 10
            const mesFormatado = mes < 10 ? '0' + mes : mes.toString();
            const dataNum = parseInt(dia.toString() + mesFormatado);
            const senhaSoma2011 = dataNum + 2011;

            document.getElementById('senha1').innerText = senhaPadrao;
            document.getElementById('senha2').innerText = senhaSoma2011;
            document.getElementById('resultado').style.display = 'block';
        }
    </script>

</body>
</html>
